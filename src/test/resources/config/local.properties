# Environment: local
# Any key can be overridden on the command line, e.g. mvn test -Dbase.url=http://other-host
base.url=http://100.50.139.45
user.email=updatedEmail@email.com
# user.password is a secret: put it in local-secrets.properties (gitignored) or pass -Duser.password=...
# Give up on a request instead of hanging when the server is down or slow
http.connect.timeout.ms=10000
http.read.timeout.ms=30000
# HTTP logging: failures = print a test's requests/responses only if it fails, all = print everything, none = off
http.log=failures
